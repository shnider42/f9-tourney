<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>
  <div class="container-xl">
    <div class="hero">
      <div class="hero-inner">
        <img class="logo" src="{{ url_for('static', filename='f9_logo.png') }}" alt="F9">
        <h1>You're in! 🎉</h1>
        {% if status == "player" %}
          <p>You grabbed a <strong>Player</strong> slot.</p>
        {% elif status == "sub" %}
          <p>You grabbed a <strong>Sub</strong> slot.</p>
        {% else %}
          <p>You're on the <strong>Waitlist</strong>. We'll ping you if a spot opens.</p>
        {% endif %}
        <a class="btn btn-primary mt-2" href="{{ url_for('index') }}">Back to roster</a>
      </div>
    </div>
  </div>
</body>
</html>
